<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Okemo Astra ✦</title>
<meta name="description" content="Okemo Astra — your tiny telescope for the internet.">
<script>
  // Anti-FOUC theme (same pattern as Themes/Themes.html) — do not remove.
  (function () {
    const stored = localStorage.getItem('vail_theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
<link rel="stylesheet" href="../src/design-tokens.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="icon" href="../images/blehfile.png">
<style>
  /* ── Astra layout & identity (appearance tokens come from design-tokens.css) ── */
  /* Cosmic playground canvas: page-local warm parchment (do NOT edit shared tokens). */
  body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; overflow-x: hidden; background-color: #fdf9f4; }
  .dark body { background-color: #1e1a18; }
  [hidden] { display: none !important; }

  /* stars */
  #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star { position: absolute; border-radius: 50%; opacity: .15; }
  @keyframes twinkle { 0%,100% { opacity: .12; } 50% { opacity: .85; } }

  /* hero */
  .hero { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 1rem; box-sizing: border-box; }
  .wordmark { margin: 0; font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 700; letter-spacing: -0.03em; background: linear-gradient(92deg, var(--accent) 10%, #f0c27b 90%); -webkit-background-clip: text; background-clip: text; color: transparent; text-align: center; }
  .tagline { margin: -2px 0 2px; font-size: .85rem; font-style: italic; color: var(--text-tertiary); }
  .constellation { position: absolute; top: 16%; right: 14%; width: 76px; height: 50px; color: var(--accent); opacity: .55; pointer-events: none; }
  .hint { margin: 2px 0 0; font-size: .72rem; color: var(--text-tertiary); }
  .foot { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-size: .72rem; color: var(--text-tertiary); }
  .foot a { color: inherit; }
  .theme-toggle { position: fixed; top: 14px; right: 14px; z-index: 30; width: 2.2rem; height: 2.2rem; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--bg-elevated); color: var(--text-secondary); cursor: pointer; font-size: .9rem; }

  /* search bar (hero + results share .bar) */
  .bar { display: flex; align-items: center; gap: 6px; width: min(560px, 92vw); height: 46px; box-sizing: border-box; padding: 4px 5px 4px 14px; border-radius: 999px; background: var(--bg-white); border: 1px solid var(--border-strong); box-shadow: 0 1px 6px rgba(0,0,0,.06); position: relative; }
  .bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent), transparent 80%); }
  .bar-icon { opacity: .55; font-size: .95rem; }
  .bar input { flex: 1; min-width: 0; background: transparent; border: none; box-shadow: none; outline: none; padding: 0; height: 100%; font-size: .95rem; color: var(--text-primary); }
  .bar input:focus { outline: none; box-shadow: none; border: none; }
  .dark .bar input { box-shadow: none; }
  .bar .skuo { height: 36px; padding: 0 14px; border-radius: 999px; font-size: .82rem; white-space: nowrap; }
  /* rainbow ring (i'm feeling cosmic) */
  .ai-ring { border-radius: 999px; padding: 1.5px; background: conic-gradient(from var(--rb, 0deg), #ff5f6d, #ffc371, #f0e05a, #5fdc7d, #5aa7ff, #b06bff, #ff5f6d); animation: rb-spin 3.2s linear infinite; }
  .ai-ring .skuo { height: 33px; background: var(--bg-white); color: var(--text-primary); font-weight: 600; box-shadow: none; }
  @property --rb { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes rb-spin { to { --rb: 360deg; } }
  @supports not (background: conic-gradient(from var(--rb), red, blue)) {
    .ai-ring { animation: none; }
    .ai-panel { border: 1px solid var(--border-strong); background: var(--bg-white); }
  }

  /* hero buttons below the bar (google homage) */
  .hero-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .hero-btns .skuo { height: 38px; padding: 0 18px; border-radius: 999px; font-size: .85rem; }
  .hero-btns .ai-ring .skuo { height: 35px; }

  /* suggestions dropdown */
  .suggest { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--bg-white); border: 1px solid var(--border-strong); border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.12); overflow: hidden; z-index: 20; }
  .suggest button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 9px 16px; font-size: .85rem; color: var(--text-primary); cursor: pointer; }
  .suggest button.active, .suggest button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .suggest button.active::before { content: '✦ '; color: var(--accent); }

  /* results view */
  .results { position: relative; z-index: 1; max-width: none; margin: 0; padding: 1rem 1rem 4rem clamp(1rem, 12vw, 180px); }
  .r-top { display: flex; align-items: center; gap: 14px; padding: 6px 2.8rem 18px 0; }
  .r-logo { font-weight: 700; font-size: 1.05rem; text-decoration: none; background: linear-gradient(92deg, var(--accent) 10%, #f0c27b 90%); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; }
  .results .bar { width: 100%; max-width: 560px; height: 42px; }
  .results .bar .skuo { height: 32px; }
  .r-meta { font-size: .75rem; color: var(--text-tertiary); margin: 0 4px 14px; }
  /* google-classic left rail: bar, panel and results share one left edge */
  .r-meta-row, .ai-panel, #result-list { max-width: 640px; }
  #result-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 22px; }
  .result { display: grid; grid-template-columns: 26px 1fr; gap: 10px; }
  /* favicon chip, slightly tilted (cosmic playground mischief) */
  .r-favi { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--bg-white); margin-top: 2px; }
  .result:nth-of-type(odd) .r-favi { transform: rotate(-7deg); }
  .result:nth-of-type(even) .r-favi { transform: rotate(6deg); }
  .r-favi-fallback { display: inline-grid; place-items: center; font-size: .7rem; color: var(--accent); }
  /* google grammar: site + breadcrumb above the title */
  .r-site { font-size: .78rem; color: var(--text-primary); }
  .r-crumb { font-size: .72rem; color: var(--text-tertiary); word-break: break-all; }
  .result .r-title { font-size: 1.05rem; color: var(--accent); text-decoration: none; line-height: 1.35; display: inline-block; margin-top: 2px; overflow-wrap: anywhere; }
  .result .r-title:hover { text-decoration: underline wavy var(--accent-light); text-underline-offset: 3px; }
  .result .r-snippet { margin: 2px 0 0; font-size: .84rem; color: var(--text-secondary); line-height: 1.5; }

  /* AI answer panel — rainbow conic border, always on */
  .ai-panel { margin: 0 0 22px; border-radius: 18px; border: 1.5px solid transparent; background: linear-gradient(var(--bg-white), var(--bg-white)) padding-box, conic-gradient(from var(--rb, 0deg), var(--accent), #f0c27b, var(--accent-light), #f0c27b, var(--accent)) border-box; animation: rb-spin 6s linear infinite; overflow: hidden; transition: border-color .6s ease; }
  /* done: shimmer settles to a plain hairline */
  .ai-panel.done { border-color: var(--border-strong); background: var(--bg-white); animation: none; }
  .ai-head { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 12px 16px 0; font-weight: 700; font-size: .92rem; color: var(--accent); }
  .ai-body { padding: 12px 16px 16px; font-size: .88rem; line-height: 1.6; color: var(--text-primary); }
  .ai-body a { color: var(--accent); }
  .ai-error { padding: 0 16px 14px; font-size: .84rem; color: var(--text-secondary); }

  /* thinking row: pulsing orb + shimmer-sweep line (chatgpt 'thinking…' grammar) */
  .ai-thinking { display: flex; align-items: center; gap: 9px; padding: 10px 2px; }
  .ai-orb { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: orb-pulse 1.2s ease-in-out infinite; flex: none; }
  @keyframes orb-pulse { 0%,100% { transform: scale(.7); opacity: .45; } 50% { transform: scale(1.15); opacity: 1; } }
  .ai-thinking-line { font-size: .84rem; background: linear-gradient(90deg, var(--text-tertiary) 20%, var(--text-primary) 50%, var(--text-tertiary) 80%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: line-shimmer 1.6s linear infinite; }
  @keyframes line-shimmer { to { background-position: -200% 0; } }

  /* meta row + AI toggle */
  .r-meta-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; max-width: 640px; }
  .r-meta-row .r-meta { margin: 0 4px 14px; }
  #ai-toggle { height: 26px; padding: 0 12px; border-radius: 999px; font-size: .72rem; line-height: 1; margin-bottom: 14px; }
  #ai-toggle[aria-pressed="false"] { opacity: .55; filter: saturate(0); }

  /* tabs (google grammar: text tabs, accent underline) */
  .r-tabs { display: flex; gap: 18px; max-width: 640px; margin: -6px 0 16px; border-bottom: 1px solid var(--border-strong); }
  .r-tab { background: none; border: none; padding: 8px 2px 10px; font-family: inherit; font-size: .85rem; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .r-tab:hover { color: var(--text-primary); }
  .r-tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  /* images grid (masonry via css columns) */
  #image-grid { max-width: 900px; columns: 200px; column-gap: 10px; }
  .ig-item { display: block; width: 100%; padding: 0; border: 1px solid var(--border-strong); border-radius: 12px; overflow: hidden; background: var(--bg-elevated); cursor: zoom-in; margin: 0 0 10px; break-inside: avoid; position: relative; }
  .ig-item img { display: block; width: 100%; height: auto; }
  .ig-host { position: absolute; left: 6px; bottom: 6px; font-size: .62rem; background: rgba(0,0,0,.55); color: #fff; padding: 1px 7px; border-radius: 999px; backdrop-filter: blur(4px); }
  .ig-skel { break-inside: avoid; margin-bottom: 10px; border-radius: 12px; background: linear-gradient(100deg, var(--bg-elevated) 40%, var(--border-strong) 50%, var(--bg-elevated) 60%); background-size: 200% 100%; animation: ig-shimmer 1.4s linear infinite; }
  .ig-skel:nth-child(3n) { height: 130px; }
  .ig-skel:nth-child(3n+1) { height: 190px; }
  .ig-skel:nth-child(3n+2) { height: 160px; }
  @keyframes ig-shimmer { to { background-position: -200% 0; } }

  /* follow-up row + thread */
  .ai-follow { display: flex; gap: 6px; padding: 0 12px 12px; }
  .ai-follow input { flex: 1; min-width: 0; height: 32px; border-radius: 999px; padding: 0 12px; font-size: .82rem; }
  .ai-follow .skuo { height: 32px; width: 32px; padding: 0; border-radius: 50%; flex: none; }

  /* chat thread: plain Astra turns, grey right-aligned user bubbles */
  .ai-turn { margin: 2px 0 8px; }
  .ai-bubble-user { width: fit-content; max-width: 85%; margin: 12px 0 4px auto; padding: 8px 13px; border-radius: 16px 16px 4px 16px; background: var(--bg-elevated); border: 1px solid var(--border-strong); font-size: .85rem; color: var(--text-primary); }
  #ai-expand { width: 28px; height: 28px; padding: 0; border-radius: 8px; font-size: .85rem; flex: none; }

  .status-card { text-align: center; padding: 2rem 1rem; font-size: .9rem; color: var(--text-secondary); }
  .status-card .big { font-size: 1.6rem; display: block; margin-bottom: 8px; }

  /* image preview: right side panel (desktop) / bottom sheet (mobile) */
  #ig-preview { position: fixed; inset: 0; z-index: 70; }
  .igp-scrim { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
  .igp-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 94vw); padding: 16px; overflow-y: auto; border-radius: 18px 0 0 18px; display: flex; flex-direction: column; gap: 10px; }
  .igp-close { align-self: flex-end; width: 30px; height: 30px; padding: 0; border-radius: 50%; flex: none; }
  .igp-imgwrap { border-radius: 12px; overflow: hidden; border: 1px solid var(--border-strong); background: var(--bg-white); }
  .igp-imgwrap img { display: block; width: 100%; height: auto; }
  .igp-title { font-size: .9rem; color: var(--text-primary); line-height: 1.4; }
  .igp-host { font-size: .75rem; color: var(--text-tertiary); }
  .igp-actions { display: flex; gap: 8px; }
  .igp-actions .skuo { height: 34px; padding: 0 14px; border-radius: 999px; font-size: .8rem; display: inline-flex; align-items: center; text-decoration: none; }

  /* fullscreen: the same panel becomes a fixed overlay (no state loss mid-stream) */
  .ai-panel.ai-fullscreen { position: fixed; inset: 0; z-index: 60; max-width: none; margin: 0; border-radius: 0; height: 100dvh; display: flex; flex-direction: column; }
  .ai-panel.ai-fullscreen > * { width: 100%; max-width: 760px; margin-left: auto; margin-right: auto; }
  .ai-panel.ai-fullscreen .ai-body { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
  .ai-panel.ai-fullscreen .ai-follow { padding-bottom: max(12px, env(safe-area-inset-bottom)); }

  /* infinite-scroll sentinel */
  .r-sentinel { list-style: none; text-align: center; padding: 8px 0 4px; font-size: .8rem; color: var(--text-tertiary); }
  .r-sentinel-dot { display: inline-block; animation: sentinel-pulse 1.2s ease-in-out infinite; }
  @keyframes sentinel-pulse { 0%,100% { opacity: .3; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }
  .r-sentinel .skuo { font-size: .78rem; margin-top: 4px; }

  @media (max-width: 768px) {
    /* ── mobile mode: a different layout, not a shrunk desktop column ── */
    .bar .skuo .lbl { display: none; }        /* icon-first bar button */
    .hero-btns .skuo .lbl { display: none; }  /* icon-first hero pills */
    .hero .wordmark { font-size: 1.5rem; }
    .constellation { right: 6%; top: 12%; }
    .results { padding: .75rem 0 3rem; }      /* full-bleed: rows go edge to edge */
    .r-top { flex-wrap: nowrap; gap: 8px; padding: 6px calc(2.2rem + 18px) 12px 12px; }
    .r-logo { font-size: .95rem; }
    .results .bar { max-width: none; height: 40px; }
    .r-meta-row, .ai-panel, #result-list { max-width: none; }
    .r-meta-row { margin: 0 16px 12px; }
    .r-meta-row .r-meta { margin: 0; }
    #ai-toggle { margin-bottom: 0; }
    .r-tabs { max-width: none; margin: -4px 16px 14px; }
    #image-grid { max-width: none; margin: 0 12px; columns: 150px; }
    .ai-panel { margin: 0 12px 18px; }
    #result-list { gap: 0; }
    .result { padding: 12px 16px; gap: 8px; border-top: 1px solid var(--border-strong); }
    .result:last-child { border-bottom: 1px solid var(--border-strong); }
    .status-card { margin: 0 12px; }
    .igp-panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 82vh; border-radius: 18px 18px 0 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .star, .ai-ring, .ai-panel, .r-sentinel-dot, .ig-skel { animation: none !important; }
    .ai-orb { animation: none; }
    .ai-thinking-line { animation: none; background: none; color: var(--text-tertiary); }
    .ai-panel { transition: none; }
  }
</style>
</head>
<body>
<div id="stars" aria-hidden="true"></div>
<button id="theme-toggle" class="theme-toggle" title="toggle theme" aria-label="toggle theme">◐</button>

<!-- ═══ HERO ═══ -->
<main id="hero" class="hero">
  <svg class="constellation" viewBox="0 0 52 34" fill="none" aria-hidden="true">
    <path d="M4 26 L18 14 L30 20 L46 6" stroke="currentColor" stroke-width=".6" opacity=".5"/>
    <circle cx="4" cy="26" r="2" fill="currentColor"/><circle cx="18" cy="14" r="2.4" fill="currentColor"/>
    <circle cx="30" cy="20" r="1.8" fill="currentColor"/><circle cx="46" cy="6" r="2.4" fill="currentColor"/>
  </svg>
  <div>
    <h1 class="wordmark">✦ Okemo Astra</h1>
    <p class="tagline">your tiny telescope for the internet</p>
  </div>
  <div class="bar" id="hero-bar">
    <span class="bar-icon">🔭</span>
    <input id="hero-input" type="text" enterkeyhint="search" autocomplete="off" spellcheck="false" aria-label="Search the web">
    <div class="suggest" id="hero-suggest" hidden></div>
  </div>
  <div class="hero-btns">
    <button class="skuo skuo-neutral" id="hero-search" aria-label="search">🔍 <span class="lbl">search the cosmos</span></button>
    <span class="ai-ring"><button class="skuo" id="hero-cosmic" aria-label="i'm feeling cosmic">✦ <span class="lbl">i'm feeling cosmic</span></button></span>
  </div>
  <p class="hint">enter = search · no wrong questions</p>
  <footer class="foot">made of stardust · <a href="../index.html">okemo</a> ✦</footer>
</main>

<!-- ═══ RESULTS ═══ -->
<main id="results" class="results" hidden>
  <header class="r-top">
    <a class="r-logo" href="./" id="logo-home">✦ Astra</a>
    <div class="bar" id="results-bar">
      <span class="bar-icon">🔭</span>
      <input id="results-input" type="text" enterkeyhint="search" autocomplete="off" spellcheck="false" aria-label="Search the web">
      <button class="skuo skuo-neutral" id="results-search" aria-label="search">🔍 <span class="lbl">Search</span></button>
      <div class="suggest" id="results-suggest" hidden></div>
    </div>
  </header>
  <nav class="r-tabs" id="r-tabs">
    <button class="r-tab on" id="tab-all" type="button">All</button>
    <button class="r-tab" id="tab-images" type="button">✦ Images</button>
  </nav>
  <section id="ai-panel" class="ai-panel" hidden>
    <div class="ai-head"><span id="ai-head-label">✦ Astra Answer</span><button class="skuo skuo-icon" id="ai-expand" aria-label="fullscreen" title="fullscreen">⤢</button></div>
    <div class="ai-thinking" id="ai-thinking" hidden><span class="ai-orb"></span><span class="ai-thinking-line" id="ai-thinking-line"></span></div>
    <div class="ai-body" id="ai-body"></div>
    <div class="ai-error" id="ai-error" hidden></div>
    <div class="ai-follow" id="ai-follow" hidden>
      <input id="ai-follow-input" type="text" enterkeyhint="send" autocomplete="off" spellcheck="false" aria-label="Ask a follow-up" placeholder="ask more…">
      <button class="skuo skuo-accent" id="ai-follow-send" aria-label="ask follow-up">→</button>
      <button class="skuo skuo-neutral" id="ai-stop" aria-label="stop generating" title="stop" hidden>⏹</button>
    </div>
  </section>
  <div class="r-meta-row">
    <p class="r-meta" id="r-meta"></p>
    <button class="skuo skuo-icon" id="ai-toggle" aria-pressed="true" aria-label="toggle AI answer">✦ AI</button>
  </div>
  <ol id="result-list"></ol>
  <div id="image-grid" hidden></div>
</main>

<aside id="ig-preview" hidden>
  <div class="igp-scrim" id="igp-scrim"></div>
  <div class="igp-panel card">
    <button class="skuo skuo-icon igp-close" id="igp-close" aria-label="close preview">✕</button>
    <div class="igp-imgwrap"><img id="igp-img" alt=""></div>
    <div class="igp-title" id="igp-title"></div>
    <div class="igp-host" id="igp-host"></div>
    <div class="igp-actions">
      <a class="skuo skuo-accent" id="igp-visit" target="_blank" rel="noopener">visit source</a>
      <a class="skuo skuo-neutral" id="igp-open" target="_blank" rel="noopener">open image</a>
    </div>
  </div>
</aside>

<script src="astra.js"></script>
</body>
</html>
