<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Okemo Astra ✦</title>
<meta name="description" content="Okemo Astra — your tiny telescope for the internet.">
<script>
  // Anti-FOUC theme (same pattern as Themes/Themes.html) — do not remove.
  (function () {
    const stored = localStorage.getItem('vail_theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔭</text></svg>">
<link rel="stylesheet" href="../src/site.css">
<style>
  .r-source-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .r-source-tag { padding: 1px 5px; border: 1px solid var(--border-strong); border-radius: 999px; color: var(--text-secondary); font-size: .62rem; line-height: 1.35; }
</style>

</head>
<body data-page="search">
<div id="stars" aria-hidden="true"></div>

<!-- ═══ HERO ═══ -->
<main id="hero" class="hero">
  <svg class="constellation" viewBox="0 0 52 34" fill="none" aria-hidden="true">
    <path d="M4 26 L18 14 L30 20 L46 6" stroke="currentColor" stroke-width=".6" opacity=".5"/>
    <circle cx="4" cy="26" r="2" fill="currentColor"/><circle cx="18" cy="14" r="2.4" fill="currentColor"/>
    <circle cx="30" cy="20" r="1.8" fill="currentColor"/><circle cx="46" cy="6" r="2.4" fill="currentColor"/>
  </svg>
  <div>
    <h1 class="wordmark">✦ Okemo Astra</h1>
    <p class="tagline">your tiny telescope for the internet</p>
  </div>
  <div class="bar" id="hero-bar">
    <span class="bar-icon">🔭</span>
    <span class="ph-wrap"><input id="hero-input" type="text" role="combobox" aria-autocomplete="list" aria-controls="hero-suggest" aria-expanded="false" enterkeyhint="search" autocomplete="off" spellcheck="false" aria-label="Search the web" placeholder="search the web…"><span class="ph-ghost" id="hero-ghost" aria-hidden="true"></span></span>
    <div class="suggest" id="hero-suggest" role="listbox" hidden></div>
  </div>
  <div class="hero-btns">
    <button class="skuo skuo-neutral" id="hero-search" aria-label="search">🔍 <span class="lbl">search the cosmos</span></button>
    <span class="ai-ring"><button class="skuo" id="hero-cosmic" aria-label="i'm feeling cosmic">✦ <span class="lbl">i'm feeling cosmic</span></button></span>
  </div>
  <p class="hint">enter = search · no wrong questions</p>
  <footer class="foot">made of stardust · <a href="../index.html">okemo</a> ✦</footer>
</main>

<!-- ═══ RESULTS ═══ -->
<main id="results" class="results" hidden>
  <header class="r-top">
    <a class="r-logo" href="./" id="logo-home">✦ Astra</a>
    <div class="bar" id="results-bar">
      <span class="bar-icon">🔭</span>
      <span class="ph-wrap"><input id="results-input" type="text" role="combobox" aria-autocomplete="list" aria-controls="results-suggest" aria-expanded="false" enterkeyhint="search" autocomplete="off" spellcheck="false" aria-label="Search the web" placeholder="search the web…"><span class="ph-ghost" id="results-ghost" aria-hidden="true"></span></span>
      <button class="skuo skuo-neutral" id="results-search" aria-label="search">🔍 <span class="lbl">Search</span></button>
      <div class="suggest" id="results-suggest" role="listbox" hidden></div>
    </div>
  </header>
  <nav class="r-tabs" id="r-tabs" role="tablist" aria-label="Search result views">
    <button class="r-tab on" id="tab-all" type="button" role="tab" aria-controls="result-list" aria-selected="true" tabindex="0">All</button>
    <button class="r-tab" id="tab-images" type="button" role="tab" aria-controls="image-grid" aria-selected="false" tabindex="-1">✦ Images</button>
  </nav>
  <section id="ai-panel" class="ai-panel" aria-busy="false" hidden>
    <div class="ai-head">
      <span id="ai-head-label">✦ Astra Answer</span>
      <div class="ai-mode-toggle" id="ai-mode-toggle" role="radiogroup" aria-label="AI panel mode">
        <button class="ai-mode-btn on" id="ai-mode-answer" role="radio" aria-checked="true" tabindex="0" type="button">Answer</button>
        <button class="ai-mode-btn" id="ai-mode-perspectives" role="radio" aria-checked="false" tabindex="-1" type="button">⚖ Perspectives</button>
      </div>
      <button class="skuo skuo-icon" id="ai-expand" aria-label="fullscreen" aria-expanded="false" aria-controls="ai-panel" title="fullscreen">⤢</button>
    </div>
    <p class="ai-provenance" id="ai-provenance">AI-generated, grounded in the first five results. It can still be confidently wrong.</p>
    <div class="ai-sources" id="ai-sources" aria-label="Grounding sources"></div>
    <div class="ai-thinking" id="ai-thinking" role="status" aria-live="polite" hidden><span class="ai-orb"></span><span class="ai-thinking-line" id="ai-thinking-line"></span></div>
    <div class="ai-body" id="ai-body"></div>
    <div class="ai-error" id="ai-error" role="status" aria-live="polite" hidden></div>
    <div class="ai-follow" id="ai-follow" hidden>
      <input id="ai-follow-input" type="text" enterkeyhint="send" autocomplete="off" spellcheck="false" aria-label="Ask a follow-up" placeholder="ask more…">
      <button class="skuo skuo-accent" id="ai-follow-send" aria-label="ask follow-up">→</button>
      <button class="skuo skuo-neutral" id="ai-stop" aria-label="stop generating" title="stop" hidden>⏹</button>
    </div>
  </section>
  <div class="r-meta-row">
    <p class="r-meta" id="r-meta" role="status" aria-live="polite"></p>
    <button class="skuo skuo-icon" id="ai-toggle" aria-pressed="true" aria-label="Hide AI answer">✦ AI</button>
  </div>
  <ol id="result-list" role="tabpanel" aria-labelledby="tab-all" aria-busy="false"></ol>
  <div id="image-grid" role="tabpanel" aria-labelledby="tab-images" hidden></div>
</main>

<aside id="ig-preview" role="dialog" aria-modal="true" aria-labelledby="igp-title" hidden>
  <div class="igp-scrim" id="igp-scrim"></div>
  <div class="igp-panel card">
    <button class="skuo skuo-icon igp-close" id="igp-close" aria-label="close preview">✕</button>
    <div class="igp-imgwrap"><img id="igp-img" alt=""></div>
    <div class="igp-title" id="igp-title"></div>
    <div class="igp-host" id="igp-host"></div>
    <div class="igp-actions">
      <a class="skuo skuo-accent" id="igp-visit" target="_blank" rel="noopener">visit source</a>
      <a class="skuo skuo-neutral" id="igp-open" target="_blank" rel="noopener">open image</a>
    </div>
  </div>
</aside>

<aside id="link-preview" class="link-preview" aria-hidden="true" aria-label="Website preview">
  <div class="lp-panel card">
    <button class="skuo skuo-icon lp-close" id="lp-close" aria-label="close preview">✕</button>
    <div class="lp-head">
      <img id="lp-favicon" class="lp-favicon" alt="" aria-hidden="true" referrerpolicy="no-referrer">
      <div class="lp-headtext">
        <div class="lp-title" id="lp-title"></div>
        <div class="lp-host" id="lp-host"></div>
      </div>
    </div>
    <div class="lp-frame-wrap">
      <div class="lp-ogwrap" id="lp-ogwrap" hidden>
        <img id="lp-ogimage" class="lp-ogimage" alt="" aria-hidden="true" referrerpolicy="no-referrer" loading="lazy">
      </div>
      <div id="lp-snippet-block">
        <p class="lp-snippet" id="lp-snippet"></p>
      </div>
      <iframe id="lp-frame" class="lp-frame" title="Website preview" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin" loading="lazy" hidden></iframe>
    </div>
    <a class="skuo skuo-accent lp-visit" id="lp-visit" target="_blank" rel="noopener">open in new tab ↗</a>
  </div>
</aside>

<script src="../src/motion.js"></script>
<script src="astra-helpers.js"></script>
<script src="astra.js"></script>
</body>
</html>
