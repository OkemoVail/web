<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Research | OLM North Star</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        (function () {
            const stored = localStorage.getItem('vail_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        parchment: 'var(--bg)',
                        ivory: 'var(--bg-elevated)',
                        'text-warm': 'var(--text-primary)',
                        'olive-gray': 'var(--text-secondary)',
                        'stone-gray': 'var(--text-tertiary)',
                        rosewood: 'var(--accent)',
                        'border-cream': 'var(--border)',
                        'border-warm': 'var(--border-strong)',
                        'surf-dark': 'var(--surface-dark)',
                        'deep-dark': 'var(--deep-dark)',
                    },
                    fontFamily: {
                        sans: ['Satoshi', 'Inter', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../src/site.css">
    
</head>

<body data-page="manage" class="bg-parchment transition-colors duration-500 overflow-x-hidden">

    <header class="fixed top-0 left-0 w-full z-[100] px-6 py-8 pointer-events-none">
        <div class="max-w-7xl mx-auto flex items-center justify-start">
            <div class="header-island pr-2">
                <button id="connect-btn" onclick="connectStorage()"
                    class="skuo skuo-neutral skuo-pill flex items-center gap-2 px-3 py-1.5 text-olive-gray rounded-full font-bold text-xs active:scale-95 transition-all">
                    <i class="fa-solid fa-link text-[10px]"></i>
                    <span>Connect Storage</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 pt-40 pb-24">
        <div id="status-msg"
            class="fixed top-24 left-1/2 -translate-x-1/2 text-xs font-bold transition-opacity opacity-0 px-4 py-2 rounded-full bg-ivory border border-border-cream shadow-xl z-50">
        </div>
        <div class="mb-16">
            <h1 class="text-4xl font-black tracking-tight text-text-warm mb-4">Research Management
            </h1>
            <p class="text-olive-gray font-medium">Manage, edit, or remove your published research
                papers.</p>
        </div>

        <div id="manage-list" class="flex flex-col gap-4">

        </div>

        <div id="empty-state" class="hidden py-24 text-center">
            <i class="fa-solid fa-folder-open text-4xl text-stone-gray mb-6"></i>
            <p class="text-olive-gray font-medium">No custom research papers found.</p>
            <a href="editor.html"
                class="inline-block mt-8 text-rosewood font-black uppercase tracking-widest text-xs hover:opacity-70 transition-opacity">Create
                your first paper</a>
        </div>
    </main>

    <script src="updatenotes.js"></script>
    <script>
        let blogsFileHandle = null;

        async function connectStorage() {
            try {
                const [handle] = await window.showOpenFilePicker({
                    types: [{
                        description: 'JSON Files',
                        accept: { 'application/json': ['.json'] },
                    }],
                    multiple: false
                });
                blogsFileHandle = handle;

                const btn = document.getElementById('connect-btn');
                btn.innerHTML = '<i class="fa-solid fa-check text-[10px]"></i><span>Connected</span>';
                btn.className = "flex items-center gap-2 px-3 py-1.5 bg-rosewood/10 text-rosewood rounded-full font-bold text-xs transition-all";
            } catch (err) {
                console.error("Storage connection failed:", err);
            }
        }

        function applyTheme() {
            const theme = localStorage.getItem('vail_theme') || 'system';
            const html = document.documentElement;
            if (theme === 'system') {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                html.classList.toggle('dark', prefersDark);
            } else {
                html.classList.toggle('dark', theme === 'dark');
            }
        }

        function renderList() {
            const list = document.getElementById('manage-list');
            const empty = document.getElementById('empty-state');
            const blogs = JSON.parse(localStorage.getItem('olm_blogs') || '[]');

            if (blogs.length === 0) {
                list.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            list.innerHTML = blogs.map(blog => {
                const tags = (blog.tags || []).map(t => {
                    const colorMap = { blue: 'blue', red: 'red', green: 'emerald', yellow: 'amber' };
                    const twColor = colorMap[t.color] || 'blue';
                    return `<span class="text-[9px] font-black uppercase tracking-widest text-${twColor}-500">${t.name}</span>`;
                }).join(' ');

                return `
                    <div class="card card-pad manage-card flex items-center justify-between gap-6">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-3 mb-2">
                                ${tags}
                                <span class="text-[9px] font-bold text-stone-gray uppercase tracking-widest">${blog.date}</span>
                            </div>
                            <h3 class="text-lg font-bold text-text-warm truncate">${blog.title}</h3>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="deletePost('${blog.id}')" class="w-10 h-10 flex items-center justify-center rounded-full bg-red-50 dark:bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition-all">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function deletePost(id) {
            if (!confirm('Are you sure you want to delete this research paper?')) return;
            const blogs = JSON.parse(localStorage.getItem('olm_blogs') || '[]');
            const updated = blogs.filter(b => b.id !== id);


            localStorage.setItem('olm_blogs', JSON.stringify(updated));
            renderList();


            if (blogsFileHandle) {
                try {
                    const statusMsg = document.getElementById('status-msg');
                    if (statusMsg) {
                        statusMsg.innerText = "Syncing deletion to file...";
                        statusMsg.className = "fixed top-24 left-1/2 -translate-x-1/2 text-xs font-bold text-blue-500 px-4 py-2 rounded-full bg-ivory border border-border-cream shadow-xl z-50 transition-opacity opacity-100";
                    }

                    const options = { mode: 'readwrite' };
                    if (await blogsFileHandle.requestPermission(options) !== 'granted') return;

                    const writable = await blogsFileHandle.createWritable();
                    await writable.write(JSON.stringify(updated, null, 2));
                    await writable.close();

                    if (statusMsg) {
                        statusMsg.innerText = "File Synced";
                        statusMsg.className = "fixed top-24 left-1/2 -translate-x-1/2 text-xs font-bold text-rosewood px-4 py-2 rounded-full bg-ivory border border-border-cream shadow-xl z-50 transition-opacity opacity-100";
                        setTimeout(() => statusMsg.style.opacity = "0", 2000);
                    }
                } catch (error) {
                    console.error("Local sync failed:", error);
                    alert("Local Storage updated, but could not sync to file.");
                }
            } else {
                alert("Deleted from LocalStorage. To sync this change to BLOGS.json, please click 'Connect Storage' first.");
            }
        }

        applyTheme();
        renderList();
        setTimeout(window.checkChangelog, 1000);

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if ((localStorage.getItem('vail_theme') || 'system') === 'system') applyTheme();
        });
    </script>
  <script>
    window.NAV_CONFIG = {
      links: [
        { label: 'Home', href: '/index.html' },
        { label: 'Chat', href: '/AI/chat.html' },
        { label: 'Research', href: '/AI/research.html' }
      ],
      primary: { label: 'Home', href: '/AI/index.html' }
    };
  </script>
  <script src="../src/nav.js"></script>
</body>

</html>
