<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EDITOR | OLM</title>
    <link rel="icon" type="image/x-icon" href="https://avatars.githubusercontent.com/u/179893130?v=4">

    
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        (function() {
            const stored = localStorage.getItem('vail_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        parchment:      'var(--bg)',
                        ivory:          'var(--bg-elevated)',
                        'text-warm':    'var(--text-primary)',
                        'olive-gray':   'var(--text-secondary)',
                        'stone-gray':   'var(--text-tertiary)',
                        rosewood:       'var(--accent)',
                        'border-cream': 'var(--border)',
                        'border-warm':  'var(--border-strong)',
                        'surf-dark':    'var(--surface-dark)',
                        'deep-dark':    'var(--deep-dark)',
                    },
                    fontFamily: {
                        serif: ['Century', 'Georgia', 'serif'],
                        sans:  ['Satoshi', 'Inter', 'sans-serif'],
                        mono:  ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="../src/site.css">
    

    
</head>

<body data-page="editor" class="h-full overflow-y-auto no-scrollbar">
    
    <header
        class="h-14 lg:h-16 flex items-center justify-end px-4 lg:px-6 z-50 pointer-events-none fixed top-0 left-0 right-0">
        <div class="flex items-center gap-2 pointer-events-auto">
            <div class="header-island pr-2">
                <button id="connect-btn" onclick="connectStorage()"
                    class="flex items-center gap-2 px-3 py-1.5 bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 rounded-full font-bold text-xs hover:bg-zinc-200 dark:hover:bg-zinc-700 active:scale-95 transition-all">
                    <i class="fa-solid fa-link text-[10px]"></i>
                    <span>Connect</span>
                </button>
                <div class="w-px h-1/2 bg-zinc-200 dark:bg-zinc-800 mx-1"></div>
                <button onclick="publishBlog()"
                    class="flex items-center gap-2 px-4 py-1.5 bg-blue-600 text-white rounded-full font-bold text-xs hover:brightness-110 active:scale-95 transition-all">
                    <span>Publish</span>
                </button>
            </div>
        </div>
    </header>

    <main class="pt-24 lg:pt-28 pb-32">
        <div class="editor-container">
            
            <div class="flex justify-center mb-6 sticky top-20 z-40">
                <div class="editor-toolbar">
                    <button onclick="execCmd('bold')" class="toolbar-btn skuo skuo-icon" title="Bold"><i
                            class="fa-solid fa-bold"></i></button>
                    <button onclick="execCmd('italic')" class="toolbar-btn skuo skuo-icon" title="Italic"><i
                            class="fa-solid fa-italic"></i></button>
                    <div class="w-px h-6 bg-zinc-200 dark:bg-zinc-700 mx-1"></div>
                    <button onclick="execCmd('formatBlock', 'H1')" class="toolbar-btn skuo skuo-icon text-[10px] font-black"
                        title="Heading 1">H1</button>
                    <button onclick="execCmd('formatBlock', 'H2')" class="toolbar-btn skuo skuo-icon text-[10px] font-black"
                        title="Heading 2">H2</button>
                    <button onclick="execCmd('formatBlock', 'P')" class="toolbar-btn skuo skuo-icon text-[10px] font-black"
                        title="Paragraph">P</button>
                    <div class="w-px h-6 bg-zinc-200 dark:bg-zinc-700 mx-1"></div>
                    <button onclick="execCmd('insertUnorderedList')" class="toolbar-btn skuo skuo-icon" title="Bullet List"><i
                            class="fa-solid fa-list-ul"></i></button>
                    <div class="w-px h-6 bg-zinc-200 dark:bg-zinc-700 mx-1"></div>
                    <select onchange="execCmd('fontSize', this.value)"
                        class="bg-transparent text-xs font-bold outline-none border-none cursor-pointer text-zinc-500 dark:text-zinc-400">
                        <option value="3">Small</option>
                        <option value="4" selected>Normal</option>
                        <option value="5">Large</option>
                        <option value="6">Huge</option>
                    </select>
                </div>
            </div>

            
            <div class="editor-paper" id="drop-zone overflow-hidden">
                <div class="flex flex-col gap-6 mb-12">
                    <div class="flex items-center justify-between">
                        <div class="flex flex-wrap gap-2" id="tags-selector">
                            <button onclick="toggleTag('Architecture', 'blue')" id="tag-Architecture"
                                class="px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest border-2 border-blue-500/20 text-blue-500/40 hover:bg-blue-500/5 transition-all">Architecture</button>
                            <button onclick="toggleTag('Core Logic', 'red')" id="tag-Core Logic"
                                class="px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest border-2 border-red-500/20 text-red-500/40 hover:bg-red-500/5 transition-all">Core
                                Logic</button>
                            <button onclick="toggleTag('UX/Design', 'green')" id="tag-UX/Design"
                                class="px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest border-2 border-emerald-500/20 text-emerald-500/40 hover:bg-emerald-500/5 transition-all">UX/Design</button>
                            <button onclick="toggleTag('Hardware', 'yellow')" id="tag-Hardware"
                                class="px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest border-2 border-amber-500/20 text-amber-500/40 hover:bg-amber-500/5 transition-all">Hardware</button>
                        </div>
                        <div class="text-[10px] font-bold text-zinc-400 dark:text-zinc-500 uppercase tracking-widest"
                            id="current-date">FEB 2026</div>
                    </div>
                </div>

                <div id="blog-editor" contenteditable="true"
                    class="min-h-[800px] text-lg text-zinc-800 dark:text-zinc-100">
                    <h1 id="blog-title-input" class="placeholder" data-placeholder="Untitled Research Paper"></h1>
                    <p class="placeholder"
                        data-placeholder="Start your research analysis here... Drag and drop images directly into this area.">
                    </p>
                </div>
                <div id="status-msg" class="text-center text-xs font-bold text-green-500 opacity-0 transition-opacity">
                    Updated Successfully!</div>
            </div>
        </div>
    </main>

    <script src="updatenotes.js"></script>
    <script>
        let selectedTags = [];
        const tagColors = {
            'Architecture': 'blue',
            'Core Logic': 'red',
            'UX/Design': 'green',
            'Hardware': 'yellow'
        };

        function toggleTag(tag, color) {
            const btn = document.getElementById(`tag-${tag}`);
            const isActive = selectedTags.some(t => t.name === tag);

            const colorMap = { blue: 'blue', red: 'red', green: 'emerald', yellow: 'amber' };
            const twColor = colorMap[color];

            if (isActive) {
                selectedTags = selectedTags.filter(t => t.name !== tag);
                btn.className = `px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest border-2 border-${twColor}-500/20 text-${twColor}-500/40 hover:bg-${twColor}-500/5 transition-all`;
            } else {
                selectedTags.push({ name: tag, color: color });
                btn.className = `px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest bg-${twColor}-500 text-white border-transparent transition-all`;
            }
        }

        function execCmd(command, value = null) {
            document.execCommand(command, false, value);
        }

        
        const editor = document.getElementById('blog-editor');

        editor.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
        });

        editor.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();

            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const imgHtml = `
    <div class="editor-image-container inline" contenteditable="false">
        <img src="${event.target.result}" style="width: 300px;">
        <div class="image-controls">
            <button class="control-btn skuo" onclick="alignImg(this, 'float-left')">Left</button>
            <button class="control-btn skuo" onclick="alignImg(this, 'inline')">Center</button>
            <button class="control-btn skuo" onclick="alignImg(this, 'float-right')">Right</button>
            <button class="control-btn skuo skuo-icon" onclick="resizeImg(this, -50)">-</button>
            <button class="control-btn skuo skuo-icon" onclick="resizeImg(this, 50)">+</button>
        </div>
    </div>
    `;
                    document.execCommand('insertHTML', false, imgHtml);
                };
                reader.readAsDataURL(file);
            }
        });

        function alignImg(btn, alignment) {
            const container = btn.closest('.editor-image-container');
            container.className = `editor-image-container ${alignment}`;
        }

        function resizeImg(btn, delta) {
            const img = btn.closest('.editor-image-container').querySelector('img');
            const currentWidth = img.clientWidth;
            img.style.width = (currentWidth + delta) + 'px';
        }

        let blogsFileHandle = null;

        async function connectStorage() {
            try {
                const [handle] = await window.showOpenFilePicker({
                    types: [{
                        description: 'JSON Files',
                        accept: { 'application/json': ['.json'] },
                    }],
                    multiple: false
                });
                blogsFileHandle = handle;

                const btn = document.getElementById('connect-btn');
                btn.innerHTML = '<i class="fa-solid fa-check text-[10px]"></i><span>Connected</span>';
                btn.className = "flex items-center gap-2 px-3 py-1.5 bg-emerald-500/10 text-emerald-500 rounded-full font-bold text-xs transition-all";

                console.log("File handle acquired:", handle.name);
            } catch (err) {
                console.error("Storage connection failed:", err);
            }
        }

        async function publishBlog() {
            const editorContent = document.getElementById('blog-editor').innerHTML;
            const date = document.getElementById('current-date').innerText;
            const statusMsg = document.getElementById('status-msg');

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = editorContent;
            const titleElem = tempDiv.querySelector('h1');
            const title = titleElem ? titleElem.innerText : 'Untitled';

            if (titleElem) titleElem.remove();
            const content = tempDiv.innerHTML;

            if (!title || !content.trim()) {
                alert('Please provide a title and content.');
                return;
            }

            const newBlog = {
                id: Date.now().toString(),
                title,
                tags: [...selectedTags],
                content,
                date,
                isRich: true
            };

            
            const localBlogs = JSON.parse(localStorage.getItem('olm_blogs') || '[]');
            localBlogs.unshift(newBlog);
            localStorage.setItem('olm_blogs', JSON.stringify(localBlogs));

            
            if (blogsFileHandle) {
                try {
                    if (statusMsg) {
                        statusMsg.innerText = "Writing to disk...";
                        statusMsg.style.opacity = "1";
                    }

                    
                    const options = { mode: 'readwrite' };
                    if (await blogsFileHandle.queryPermission(options) !== 'granted') {
                        if (await blogsFileHandle.requestPermission(options) !== 'granted') {
                            throw new Error('Write permission denied');
                        }
                    }

                    
                    const file = await blogsFileHandle.getFile();
                    const text = await file.text();
                    let fileBlogs = text.trim() ? JSON.parse(text) : [];

                    
                    fileBlogs.unshift(newBlog);

                    
                    const writable = await blogsFileHandle.createWritable();
                    await writable.write(JSON.stringify(fileBlogs, null, 2));
                    await writable.close();

                    if (statusMsg) {
                        statusMsg.innerText = "File Updated Successfully!";
                        statusMsg.className = "text-center text-xs font-bold text-green-500 transition-opacity";
                    }
                    setTimeout(() => window.location.href = 'research.html', 800);
                } catch (error) {
                    console.error("File write failed:", error);
                    alert("Local Storage updated, but could not write to file: " + error.message);
                    window.location.href = 'research.html';
                }
            } else {
                alert("Saved to LocalStorage. To write to BLOGS.json, please click 'Connect' first.");
                window.location.href = 'research.html';
            }
        }

        function applyTheme() {
            const theme = localStorage.getItem('vail_theme') || 'system';
            const html = document.documentElement;
            if (theme === 'system') {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                html.classList.toggle('dark', prefersDark);
            } else {
                html.classList.toggle('dark', theme === 'dark');
            }
        }

        const now = new Date();
        const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
        document.getElementById('current-date').innerText = `${months[now.getMonth()]} ${now.getFullYear()}`;

        applyTheme();
        setTimeout(window.checkChangelog, 1000);
    </script>
  <script>
    window.NAV_CONFIG = {
      links: [
        { label: 'Home', href: '/index.html' },
        { label: 'Research', href: '/AI/research.html' }
      ],
      primary: { label: 'Home', href: '/AI/index.html' }
    };
  </script>
  <script src="../src/nav.js"></script>
</body>

</html>
