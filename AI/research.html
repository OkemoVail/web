<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Research - Labs21</title>
    <link rel="icon" type="image/x-icon" href="https://avatars.githubusercontent.com/u/179893130?v=4">


    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        (function () {
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            function applyTheme(isDark) {
                document.documentElement.classList.toggle('dark', isDark);
            }
            function resolveTheme() {
                const stored = localStorage.getItem('vail_theme');
                if (stored === 'dark') applyTheme(true);
                else if (stored === 'light') applyTheme(false);
                else applyTheme(mediaQuery.matches);
            }
            resolveTheme();
            mediaQuery.addEventListener('change', () => {
                const stored = localStorage.getItem('vail_theme');
                if (!stored || stored === 'system') applyTheme(mediaQuery.matches);
            });
            window.addEventListener('storage', (e) => {
                if (e.key === 'vail_theme') resolveTheme();
            });
        })();
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        parchment: 'var(--bg)',
                        ivory: 'var(--bg-elevated)',
                        'text-warm': 'var(--text-primary)',
                        'olive-gray': 'var(--text-secondary)',
                        'stone-gray': 'var(--text-tertiary)',
                        rosewood: 'var(--accent)',
                        'rose-light': 'var(--accent-light)',
                        'border-cream': 'var(--border)',
                        'border-warm': 'var(--border-strong)',
                        'ring-warm': 'var(--shadow-ring)',
                        'surf-dark': 'var(--surface-dark)',
                        'deep-dark': 'var(--deep-dark)',
                    },
                    fontFamily: {
                        serif: ['Century', 'Georgia', 'serif'],
                        sans: ['Satoshi', 'Inter', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../src/site.css">
    

    

<body data-page="research"
    class="bg-parchment text-text-warm dark:bg-deep-dark min-h-screen flex flex-col font-sans selection:bg-rose-light selection:text-text-warm overflow-x-hidden">

    <main class="flex-1 w-full max-w-7xl mx-auto pt-24 px-8 pb-8 md:pt-28 md:px-12 md:pb-12 lg:pt-28 lg:px-20 lg:pb-20 pb-40">
        <header class="max-w-4xl mx-auto mb-16 flex justify-between items-center text-gray-900 dark:text-white">
            <h1 class="text-4xl md:text-5xl font-black tracking-tighter">Research / News</h1>
            <div class="flex items-center gap-4">
            </div>
        </header>

        <div class="max-w-4xl mx-auto">

            <div class="mb-12 animate-fade-in" style="animation-delay: 0.1s">
                <div class="relative group">
                    <div
                        class="absolute inset-y-0 left-6 flex items-center pointer-events-none text-rosewood/30 group-focus-within:text-rosewood transition-colors">
                        <i class="fa-solid fa-magnifying-glass text-lg"></i>
                    </div>
                    <input type="text" id="article-search" placeholder="Search papers, updates, and architecture..."
                        class="w-full py-5 pl-16 pr-8 outline-none transition-all text-lg font-medium placeholder-gray-400 dark:placeholder-gray-600 focus:border-rosewood/30"
                        oninput="handleSearch()">
                </div>
            </div>


            <div class="flex flex-wrap gap-3 mb-16 animate-fade-in" style="animation-delay: 0.2s" id="tag-cloud">

            </div>


            <div id="article-feed" class="flex flex-col gap-8">

            </div>
        </div>
    </main>


    <div id="reader-modal" class="fixed inset-0 overflow-hidden">
        <div class="modal-content relative flex flex-col h-full bg-parchment dark:bg-deep-dark">
            <!-- Reader Header -->
            <div
                class="sticky top-0 z-20 w-full flex items-center justify-between px-6 lg:px-16 py-6 border-b border-border-cream dark:border-white/5 bg-white dark:bg-[#121212]">
                <div class="flex items-center gap-4">
                    <span
                        class="text-xs font-black uppercase tracking-[0.2em] text-rosewood/40 dark:text-olive-gray/40">Labs21
                        Research</span>
                </div>
                <button onclick="closeReader()"
                    class="skuo skuo-icon !w-12 !h-12 !rounded-full group transition-all">
                    <i class="fa-solid fa-xmark text-lg group-hover:rotate-90 transition-transform"></i>
                </button>
            </div>

            <!-- Reader Body -->
            <div class="flex-1 overflow-y-auto w-full no-scrollbar pb-32">
                <div class="max-w-3xl mx-auto px-6 py-20">
                    <div id="modal-article-content"></div>
                </div>
            </div>

            <!-- Reader Footer Bar (Optional progress or status) -->
            <div
                class="absolute bottom-10 left-1/2 -translate-x-1/2 z-20 px-8 py-3 rounded-full bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 text-[10px] uppercase tracking-[0.3em] font-bold text-rosewood/40 dark:text-text-warm/20">
                End of Document
            </div>
        </div>
    </div>

    <script src="updatenotes.js"></script>
    <script>
        let selectedTags = new Set();
        let searchQuery = '';
        let DEFAULT_BLOGS = [];

        async function loadBlogs() {
            try {
                const response = await fetch('data/blogs.json');
                DEFAULT_BLOGS = await response.json();
                renderBlogs();
                renderTagCloud();
            } catch (e) {
                console.error("Failed to load blogs.json", e);
            }
        }

        function handleSearch() {
            searchQuery = document.getElementById('article-search').value.toLowerCase();
            renderBlogs();
        }

        function toggleTag(tag) {
            if (selectedTags.has(tag)) {
                selectedTags.delete(tag);
            } else {
                selectedTags.add(tag);
            }
            renderBlogs();
            renderTagCloud();
        }

        function renderTagCloud() {
            const cloud = document.getElementById('tag-cloud');
            if (!cloud) return;

            const tags = [
                { name: 'Architecture', color: 'blue' },
                { name: 'Core Logic', color: 'red' },
                { name: 'UX/Design', color: 'emerald' },
                { name: 'Hardware', color: 'amber' }
            ];

            cloud.innerHTML = tags.map(tag => {
                const isActive = selectedTags.has(tag.name);
                const colorMap = { blue: 'bg-sage/10 text-moss', red: 'bg-red-50 text-red-500', emerald: 'bg-emerald-50 text-emerald-500', amber: 'bg-amber-50 text-amber-500' };
                const activeColorMap = { blue: 'bg-moss text-paper', red: 'bg-red-500 text-white', emerald: 'bg-emerald-500 text-white', amber: 'bg-amber-500 text-white' };

                return `
                    <button onclick="toggleTag('${tag.name}')"
                        class="skuo skuo-pill !px-6 !py-2.5 text-[10px] uppercase tracking-widest font-bold transition-all ${isActive
                        ? `skuo-accent`
                        : ``
                    }">
                        ${tag.name}
                    </button>
                `;
            }).join('');
        }

        function renderBlogs() {
            const feed = document.getElementById('article-feed');
            if (!feed) return;

            const customBlogs = JSON.parse(localStorage.getItem('Ontologic_blogs') || '[]');
            const blogMap = new Map();
            [...DEFAULT_BLOGS, ...customBlogs].forEach(blog => blogMap.set(blog.id, blog));
            const allBlogs = Array.from(blogMap.values()).reverse();

            const filteredLines = allBlogs.filter(blog => {
                const matchesSearch = blog.title.toLowerCase().includes(searchQuery) ||
                    (blog.content && blog.content.toLowerCase().includes(searchQuery));

                const blogTags = (blog.tags || []).map(t => typeof t === 'string' ? t : t.name);
                const matchesTags = selectedTags.size === 0 || Array.from(selectedTags).every(t => blogTags.includes(t));

                return matchesSearch && matchesTags;
            });

            if (filteredLines.length === 0) {
                feed.innerHTML = `
                    <div class="py-32 text-center animate-fade-in">
                        <p class="text-gray-400 text-lg font-medium">No papers found matching your search.</p>
                    </div>
                `;
                return;
            }

            feed.innerHTML = filteredLines.map((blog, i) => {
                const tagsRaw = blog.tags || [{ name: blog.category || 'Research', color: 'blue' }];
                const tagsHtml = tagsRaw.map(t => {
                    const tagObj = typeof t === 'string' ? { name: t, color: 'blue' } : t;
                    const colorMap = { blue: 'text-blue-500', red: 'text-red-500', green: 'text-emerald-500', amber: 'text-amber-500' };
                    return `<span class="text-[11px] font-black uppercase tracking-[0.2em] ${colorMap[tagObj.color] || 'text-blue-500'}">${tagObj.name}</span>`;
                }).join('');

                return `
                    <article class="card p-10 transition-all cursor-pointer group animate-fade-in"
                        style="animation-delay: ${i * 0.1}s" 
                        onclick="openReader('${blog.id}')">
                        <div class="flex items-center justify-between mb-6">
                            <div class="flex gap-4">
                                ${tagsHtml}
                            </div>
                            <span class="text-[10px] font-bold uppercase tracking-[0.1em] text-gray-400">${blog.date || 'RECENT'}</span>
                        </div>
                        <h2 class="serif-text text-3xl font-medium tracking-tight text-rosewood mb-6 group-hover:text-rosewood transition-colors leading-tight">${blog.title}</h2>
                        <div class="rich-content line-clamp-3 text-gray-500 dark:text-gray-400 text-lg font-normal mb-10">
                            ${stripHtml(blog.content)}
                        </div>
                        <div class="flex items-center gap-3 text-rosewood font-bold text-[10px] uppercase tracking-widest">
                            <span>Read Paper</span>
                            <div class="w-8 h-8 rounded-full bg-rosewood text-parchment flex items-center justify-center group-hover:translate-x-1 transition-transform">
                                <i class="fa-solid fa-arrow-right text-[10px]"></i>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function stripHtml(html) {
            let tmp = document.createElement("DIV");
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || "";
        }

        function openReader(id) {
            const customBlogs = JSON.parse(localStorage.getItem('Ontologic_blogs') || '[]');
            const allBlogs = [...customBlogs, ...DEFAULT_BLOGS];
            const blog = allBlogs.find(b => b.id === id);

            if (!blog) return;

            const tagsRaw = blog.tags || [{ name: blog.category || 'Research', color: 'blue' }];
            const tagsHtml = tagsRaw.map(t => {
                const tagObj = typeof t === 'string' ? { name: t, color: 'blue' } : t;
                const colorMap = { blue: 'text-blue-500', red: 'text-red-500', green: 'text-emerald-500', amber: 'text-amber-500' };
                return `<span class="text-[11px] font-black uppercase tracking-[0.2em] ${colorMap[tagObj.color] || 'text-blue-500'}">${tagObj.name}</span>`;
            }).join('');

            const contentHtml = `
                <div class="text-center mb-16">
                    <div class="flex justify-center gap-4 mb-8">${tagsHtml}</div>
                    <h1 class="serif-text text-5xl md:text-7xl font-medium tracking-tight text-rosewood dark:text-text-warm mb-6 leading-[1.05]">${blog.title}</h1>
                    <div class="text-sm font-bold text-rosewood/40 dark:text-text-warm/40 uppercase tracking-[0.2em]">${blog.date || 'RECENT'}</div>
                </div>
                <div class="rich-content text-xl md:text-2xl leading-relaxed text-rosewood/80 dark:text-text-warm/70 font-normal">
                    ${blog.content}
                </div>
            `;

            document.getElementById('modal-article-content').innerHTML = contentHtml;
            const modal = document.getElementById('reader-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
            document.body.style.overflow = 'hidden';

            modal.onclick = (e) => {
                if (e.target === modal) closeReader();
            };
        }

        function closeReader() {
            const modal = document.getElementById('reader-modal');
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
                document.body.style.overflow = '';
            }, 600);
        }

        loadBlogs();


        window.addEventListener('storage', (e) => {
            if (e.key === 'Ontologic_blogs') {
                renderBlogs();
            }
        });
    </script>
