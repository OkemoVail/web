<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1000" preserveAspectRatio="xMidYMid slice">
  <!-- AION, monochrome red: two chat bubbles talking, flat tones only. -->
  <rect width="400" height="1000" fill="#e8352b"/>

  <!-- top: a huge dark quarter circle and a light half sun -->
  <path d="M400 0V330A330 330 0 0 1 70 0Z" fill="#a3201a"/>
  <path d="M400 0V170A170 170 0 0 1 230 0Z" fill="#5c0f0b"/>
  <circle cx="60" cy="150" r="70" fill="#ff7a6b"/>
  <path d="M-10 150a70 70 0 0 0 140 0Z" fill="#a3201a"/>

  <!-- the reply bubble (light, left) -->
  <path d="M40 300h250a40 40 0 0 1 40 40v110a40 40 0 0 1-40 40H120l-60 50 10-50h-30a40 40 0 0 1-40-40V340a40 40 0 0 1 40-40Z" fill="#ffc4bb"/>
  <rect x="80" y="350" width="190" height="22" fill="#e8352b"/>
  <rect x="80" y="392" width="140" height="22" fill="#e8352b"/>
  <rect x="80" y="434" width="170" height="22" fill="#ff7a6b"/>

  <!-- the question bubble (dark, right) -->
  <path d="M120 560h240a40 40 0 0 1 40 40v70a40 40 0 0 1-40 40h-10l10 50-60-50H120a40 40 0 0 1-40-40v-70a40 40 0 0 1 40-40Z" fill="#5c0f0b"/>
  <circle cx="180" cy="635" r="18" fill="#ff7a6b"/>
  <circle cx="240" cy="635" r="18" fill="#e8352b"/>
  <circle cx="300" cy="635" r="18" fill="#a3201a"/>

  <!-- bottom: stacked half circles and a dot grid, calm under the labels -->
  <path d="M0 1000a200 200 0 0 1 400 0Z" fill="#a3201a"/>
  <path d="M80 1000a120 120 0 0 1 240 0Z" fill="#5c0f0b"/>
  <g fill="#ff7a6b">
    <circle cx="30" cy="800" r="6"/><circle cx="60" cy="800" r="6"/><circle cx="90" cy="800" r="6"/>
    <circle cx="30" cy="830" r="6"/><circle cx="60" cy="830" r="6"/><circle cx="90" cy="830" r="6"/>
    <circle cx="30" cy="860" r="6"/><circle cx="60" cy="860" r="6"/><circle cx="90" cy="860" r="6"/>
  </g>
  <rect x="300" y="780" width="100" height="24" fill="#ffc4bb"/>
  <rect x="340" y="820" width="60" height="24" fill="#ff7a6b"/>
</svg>
