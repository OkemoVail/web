<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 1000" preserveAspectRatio="xMidYMid slice">
  <!-- LABS21, monochrome green screenprint: an erupting flask spilling neural-net nodes, an atom, a GPU card, test tubes. -->
  <defs>
    <pattern id="l-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#0f6b37"/><circle cx="9" cy="9" r="2.4" fill="#0f6b37"/>
    </pattern>
    <pattern id="l-dots-lite" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="2" fill="#5fd18b"/><circle cx="7.5" cy="7.5" r="2" fill="#5fd18b"/>
    </pattern>
    <pattern id="l-hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="6" height="14" fill="#0f6b37"/>
    </pattern>
    <pattern id="l-fins" width="12" height="40" patternUnits="userSpaceOnUse">
      <rect width="6" height="40" fill="#06371c"/>
    </pattern>
    <path id="l-star" d="M0-14C2-4 4-2 14 0 4 2 2 4 0 14-2 4-4 2-14 0-4-2-2-4 0-14Z"/>
    <clipPath id="l-flask"><path d="M166 470H234V560L346 760A34 34 0 0 1 316 810H84A34 34 0 0 1 54 760L166 560Z"/></clipPath>
  </defs>

  <rect width="400" height="1000" fill="#1f9d55"/>

  <!-- top: dark sky with a big halftone circle and the atom -->
  <rect width="400" height="330" fill="#0f6b37"/>
  <circle cx="200" cy="120" r="190" fill="#06371c"/>
  <circle cx="200" cy="120" r="190" fill="url(#l-dots)"/>
  <g fill="none" stroke="#c4f2d4" stroke-width="10">
    <ellipse cx="200" cy="120" rx="140" ry="42"/>
    <ellipse cx="200" cy="120" rx="140" ry="42" transform="rotate(60 200 120)" stroke="#5fd18b"/>
    <ellipse cx="200" cy="120" rx="140" ry="42" transform="rotate(-60 200 120)" stroke="#5fd18b"/>
  </g>
  <circle cx="200" cy="120" r="30" fill="#c4f2d4"/>
  <circle cx="200" cy="120" r="14" fill="#1f9d55"/>
  <circle cx="340" cy="120" r="12" fill="#eafff1"/><circle cx="130" cy="241" r="10" fill="#eafff1"/>

  <!-- eruption: a wavy plume from the flask mouth rising into a neural net -->
  <path d="M170 470C140 420 200 400 170 350C150 316 196 300 210 330C230 300 270 330 250 360C230 400 260 430 230 470Z" fill="#5fd18b"/>
  <path d="M184 470C168 430 214 410 192 370C204 360 224 372 220 392C214 420 236 440 220 470Z" fill="#c4f2d4"/>

  <!-- neural net spilling out -->
  <g stroke="#06371c" stroke-width="5" stroke-linecap="round">
    <path d="M80 300L200 290L320 300M80 300L130 380M200 290L130 380M200 290L270 390M320 300L270 390M80 300L40 420M320 300L360 430M130 380L40 420M270 390L360 430"/>
  </g>
  <g fill="#06371c"><circle cx="80" cy="300" r="22"/><circle cx="200" cy="290" r="22"/><circle cx="320" cy="300" r="22"/></g>
  <g fill="#c4f2d4"><circle cx="80" cy="300" r="12"/><circle cx="320" cy="300" r="12"/></g>
  <circle cx="200" cy="290" r="12" fill="#eafff1"/>
  <g fill="#eafff1"><circle cx="130" cy="380" r="16"/><circle cx="270" cy="390" r="16"/></g>
  <g fill="#0f6b37"><circle cx="40" cy="420" r="14"/><circle cx="360" cy="430" r="14"/></g>

  <!-- the flask -->
  <path d="M166 470H234V560L346 760A34 34 0 0 1 316 810H84A34 34 0 0 1 54 760L166 560Z" fill="#06371c" transform="translate(14 14)"/>
  <path d="M166 470H234V560L346 760A34 34 0 0 1 316 810H84A34 34 0 0 1 54 760L166 560Z" fill="#0f6b37"/>
  <g clip-path="url(#l-flask)">
    <rect x="40" y="470" width="320" height="200" fill="url(#l-hatch)"/>
    <path d="M40 660C90 640 130 680 200 660C270 640 310 680 360 660V820H40Z" fill="#5fd18b"/>
    <path d="M40 700C100 680 150 720 210 700C270 680 320 710 360 700V820H40Z" fill="#c4f2d4"/>
    <rect x="40" y="740" width="320" height="80" fill="url(#l-dots-lite)"/>
    <circle cx="150" cy="730" r="18" fill="#1f9d55"/><circle cx="250" cy="760" r="12" fill="#1f9d55"/>
    <circle cx="200" cy="620" r="14" fill="#5fd18b"/><circle cx="176" cy="580" r="9" fill="#5fd18b"/><circle cx="216" cy="530" r="7" fill="#5fd18b"/>
    <rect x="90" y="560" width="14" height="140" fill="#1f9d55" transform="rotate(30 97 630)"/>
  </g>
  <rect x="150" y="452" width="100" height="30" rx="15" fill="#c4f2d4"/>
  <g fill="#c4f2d4"><rect x="244" y="600" width="26" height="6"/><rect x="262" y="630" width="18" height="6"/><rect x="276" y="660" width="26" height="6"/></g>

  <!-- GPU card bleeding off the left -->
  <g transform="rotate(-10 60 560)">
    <rect x="-60" y="500" width="140" height="110" rx="10" fill="#06371c"/>
    <rect x="-50" y="512" width="80" height="86" fill="url(#l-fins)"/>
    <circle cx="44" cy="555" r="28" fill="#5fd18b"/>
    <circle cx="44" cy="555" r="10" fill="#06371c"/>
    <g fill="#c4f2d4"><rect x="-40" y="610" width="10" height="16"/><rect x="-20" y="610" width="10" height="16"/><rect x="0" y="610" width="10" height="16"/><rect x="20" y="610" width="10" height="16"/><rect x="40" y="610" width="10" height="16"/></g>
  </g>

  <!-- confetti -->
  <g fill="#eafff1">
    <use xlink:href="#l-star" transform="translate(350 520) scale(1.1)"/>
    <use xlink:href="#l-star" transform="translate(40 30) scale(.8)"/>
    <use xlink:href="#l-star" transform="translate(370 230) scale(.6)"/>
    <use xlink:href="#l-star" transform="translate(110 470) scale(.6)"/>
  </g>
  <g fill="#c4f2d4"><circle cx="300" cy="460" r="6"/><circle cx="370" cy="620" r="5"/><circle cx="30" cy="700" r="6"/><circle cx="20" cy="470" r="4"/></g>

  <!-- test-tube rack at the bottom, scalloped shelf -->
  <rect x="0" y="830" width="400" height="170" fill="#0f6b37"/>
  <g>
    <rect x="30" y="790" width="40" height="150" rx="20" fill="#c4f2d4"/><rect x="30" y="860" width="40" height="80" rx="20" fill="#5fd18b"/>
    <rect x="96" y="820" width="40" height="120" rx="20" fill="#c4f2d4"/><rect x="96" y="890" width="40" height="50" rx="20" fill="#06371c"/>
    <rect x="264" y="810" width="40" height="130" rx="20" fill="#c4f2d4"/><rect x="264" y="850" width="40" height="90" rx="20" fill="#5fd18b"/>
    <rect x="330" y="796" width="40" height="144" rx="20" fill="#c4f2d4"/><rect x="330" y="880" width="40" height="60" rx="20" fill="#06371c"/>
  </g>
  <rect x="0" y="900" width="400" height="22" fill="#06371c"/>
  <rect x="0" y="940" width="400" height="60" fill="url(#l-dots-lite)"/>
</svg>
