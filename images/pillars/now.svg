<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Now building, monochrome pink: stretchy glass pills, a training bar, stacked discs. -->
  <rect width="800" height="1000" fill="#ff5fa2"/>

  <!-- left: stacked discs, each a tone deeper -->
  <circle cx="160" cy="210" r="210" fill="#ff9cc6"/>
  <circle cx="160" cy="250" r="150" fill="#b0245f"/>
  <circle cx="160" cy="290" r="90" fill="#5e0f33"/>
  <circle cx="160" cy="320" r="34" fill="#ffd9ea"/>

  <!-- top right: Liquid Design, a pill caught mid-stretch beside a resting one -->
  <rect x="470" y="70" width="140" height="70" rx="35" fill="#ffd9ea"/>
  <path d="M470 180h170c50 0 90 18 120 35-30 17-70 35-120 35H470a35 35 0 0 1 0-70Z" fill="#ff9cc6"/>
  <rect x="490" y="290" width="70" height="70" rx="35" fill="#b0245f"/>

  <!-- bottom left: Saga's training bar and loss steps -->
  <rect x="40" y="620" width="380" height="40" rx="20" fill="#b0245f"/>
  <rect x="40" y="620" width="250" height="40" rx="20" fill="#ffd9ea"/>
  <path d="M40 720h80v50h80v40h80v24h80v16h60v150H40Z" fill="#b0245f"/>
  <path d="M40 820h420v180H40Z" fill="#5e0f33"/>

  <!-- bottom right: a gear for the lab -->
  <g transform="translate(660 860)" fill="#ff9cc6">
    <circle r="90"/>
    <rect x="-20" y="-120" width="40" height="240"/>
    <rect x="-120" y="-20" width="240" height="40"/>
    <rect x="-20" y="-120" width="40" height="240" transform="rotate(45)"/>
    <rect x="-20" y="-120" width="40" height="240" transform="rotate(-45)"/>
  </g>
  <circle cx="660" cy="860" r="36" fill="#ff5fa2"/>
</svg>
