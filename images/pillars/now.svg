<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Now building, monochrome pink screenprint: Liquid Design pills mid-stretch, Saga's training (progress, stepping loss, open book), gears. -->
  <defs>
    <pattern id="n-dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="3" fill="#e0397f"/><circle cx="10.5" cy="10.5" r="3" fill="#e0397f"/>
    </pattern>
    <pattern id="n-dots-lite" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#ff9cc6"/><circle cx="9" cy="9" r="2.4" fill="#ff9cc6"/>
    </pattern>
    <pattern id="n-hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="16" fill="#b0245f"/>
    </pattern>
    <pattern id="n-stripe" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="20" height="40" fill="#2e0619"/>
    </pattern>
    <path id="n-star" d="M0-16C2-5 5-2 16 0 5 2 2 5 0 16-2 5-5 2-16 0-5-2-2-5 0-16Z"/>
    <g id="n-gear">
      <circle r="90"/>
      <rect x="-22" y="-118" width="44" height="236" rx="6"/>
      <rect x="-22" y="-118" width="44" height="236" rx="6" transform="rotate(45)"/>
      <rect x="-22" y="-118" width="44" height="236" rx="6" transform="rotate(90)"/>
      <rect x="-22" y="-118" width="44" height="236" rx="6" transform="rotate(135)"/>
    </g>
  </defs>

  <rect width="800" height="1000" fill="#ff5fa2"/>

  <!-- top-left: huge halftone disc, stacked rings -->
  <circle cx="150" cy="170" r="260" fill="#ff9cc6"/>
  <circle cx="150" cy="170" r="260" fill="url(#n-dots)"/>
  <circle cx="150" cy="170" r="170" fill="#b0245f"/>
  <circle cx="150" cy="170" r="110" fill="#5e0f33"/>

  <!-- Liquid Design: a pill pulled mid-stretch, bulging toward its pointer -->
  <g transform="rotate(-14 330 260)">
    <path d="M110 214H420C520 214 600 236 660 260C600 284 520 306 420 306H110A46 46 0 0 1 110 214Z" fill="#2e0619" transform="translate(12 12)"/>
    <path d="M110 214H420C520 214 600 236 660 260C600 284 520 306 420 306H110A46 46 0 0 1 110 214Z" fill="#ffd9ea"/>
    <path d="M110 230H420C500 230 560 244 610 260H110A30 30 0 0 1 110 230Z" fill="#fff2f8"/>
    <rect x="96" y="246" width="200" height="10" rx="5" fill="#ff9cc6"/>
    <circle cx="660" cy="260" r="26" fill="#5e0f33"/>
    <circle cx="660" cy="260" r="12" fill="#fff2f8"/>
  </g>
  <!-- resting pill and a squashed one -->
  <rect x="470" y="40" width="200" height="80" rx="40" fill="#5e0f33" transform="translate(10 10)"/>
  <rect x="470" y="40" width="200" height="80" rx="40" fill="#ffd9ea"/>
  <circle cx="510" cy="80" r="24" fill="#ff5fa2"/>
  <rect x="548" y="70" width="90" height="20" rx="10" fill="#ff9cc6"/>
  <ellipse cx="190" cy="430" rx="110" ry="40" fill="#2e0619"/>
  <ellipse cx="180" cy="422" rx="110" ry="40" fill="#ff9cc6"/>
  <ellipse cx="150" cy="410" rx="40" ry="10" fill="#fff2f8"/>
  <!-- motion marks -->
  <g fill="#5e0f33"><rect x="700" y="290" width="60" height="10" rx="5"/><rect x="716" y="314" width="70" height="10" rx="5"/><rect x="700" y="338" width="44" height="10" rx="5"/></g>

  <!-- mid-left: a second gear meshing behind the book -->
  <g fill="#b0245f" transform="translate(100 600) scale(.8) rotate(10)"><use xlink:href="#n-gear"/></g>
  <circle cx="100" cy="600" r="30" fill="#ff5fa2"/>

  <!-- Saga's progress bar -->
  <rect x="40" y="520" width="440" height="50" rx="25" fill="#2e0619"/>
  <rect x="48" y="528" width="300" height="34" rx="17" fill="#fff2f8"/>
  <rect x="48" y="528" width="300" height="34" rx="17" fill="url(#n-hatch)"/>
  <circle cx="348" cy="545" r="26" fill="#ffd9ea"/><circle cx="348" cy="545" r="10" fill="#b0245f"/>

  <!-- stepping loss curve, bars below it -->
  <path d="M40 640H120V700H200V760H280V800H360V826H440V840H520V1000H40Z" fill="#b0245f"/>
  <path d="M40 640H120V700H200V760H280V800H360V826H440V840H520" fill="none" stroke="#fff2f8" stroke-width="10" stroke-linejoin="round"/>
  <g fill="#fff2f8"><circle cx="120" cy="640" r="12"/><circle cx="200" cy="700" r="12"/><circle cx="280" cy="760" r="12"/><circle cx="360" cy="800" r="12"/><circle cx="440" cy="826" r="12"/></g>
  <rect x="40" y="860" width="480" height="140" fill="url(#n-dots-lite)"/>

  <!-- Saga's open book on the steps -->
  <path d="M260 760C220 738 160 736 112 754V850C160 834 220 836 260 856C300 836 360 834 408 850V754C360 736 300 738 260 760Z" fill="#2e0619"/>
  <path d="M260 748C226 726 172 724 128 740V832C172 818 226 820 260 842Z" fill="#fff2f8"/>
  <path d="M260 748C294 726 348 724 392 740V832C348 818 294 820 260 842Z" fill="#ffd9ea"/>
  <path d="M260 748C286 704 334 694 380 706C344 720 292 734 260 748Z" fill="#ff9cc6"/>
  <g fill="#ff5fa2"><rect x="146" y="760" width="90" height="8" rx="4"/><rect x="146" y="780" width="70" height="8" rx="4"/><rect x="146" y="800" width="96" height="8" rx="4"/></g>
  <g fill="#b0245f"><rect x="282" y="764" width="90" height="8" rx="4"/><rect x="282" y="784" width="64" height="8" rx="4"/><rect x="282" y="804" width="84" height="8" rx="4"/></g>
  <rect x="256" y="750" width="8" height="94" fill="#5e0f33"/>

  <!-- bottom-right: big gear bleeding off, hazard stripe -->
  <g fill="#5e0f33" transform="translate(690 880) rotate(20)"><use xlink:href="#n-gear"/></g>
  <circle cx="690" cy="880" r="56" fill="#ff9cc6"/>
  <circle cx="690" cy="880" r="26" fill="#2e0619"/>
  <rect x="0" y="960" width="800" height="40" fill="#ffd9ea"/>
  <rect x="0" y="960" width="800" height="40" fill="url(#n-stripe)"/>

  <!-- confetti -->
  <g fill="#fff2f8">
    <use xlink:href="#n-star" transform="translate(420 140) scale(1.4)"/>
    <use xlink:href="#n-star" transform="translate(740 160) scale(.9)"/>
    <use xlink:href="#n-star" transform="translate(560 640) scale(1.1)"/>
    <use xlink:href="#n-star" transform="translate(40 470) scale(.7)"/>
    <use xlink:href="#n-star" transform="translate(470 470) scale(.6)"/>
  </g>
  <g fill="#5e0f33"><circle cx="760" cy="60" r="10"/><circle cx="420" cy="380" r="8"/><circle cx="560" cy="740" r="9"/><circle cx="30" cy="390" r="6"/></g>
  <g fill="#ffd9ea"><circle cx="620" cy="500" r="7"/><circle cx="760" cy="620" r="6"/><circle cx="380" cy="60" r="6"/></g>
</svg>
