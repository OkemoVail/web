<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 1000" preserveAspectRatio="xMidYMid slice">
  <!-- WORD, monochrome saffron screenprint: a format ribbon, a flying page with a blinking cursor, a giant pen nib writing. -->
  <defs>
    <pattern id="w-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#e09a00"/><circle cx="9" cy="9" r="2.4" fill="#e09a00"/>
    </pattern>
    <pattern id="w-dots-dark" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="2" fill="#6b4300"/><circle cx="7.5" cy="7.5" r="2" fill="#6b4300"/>
    </pattern>
    <pattern id="w-hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="14" fill="#b87400"/>
    </pattern>
    <path id="w-star" d="M0-14C2-4 4-2 14 0 4 2 2 4 0 14-2 4-4 2-14 0-4-2-2-4 0-14Z"/>
  </defs>

  <rect width="400" height="1000" fill="#ffb800"/>

  <!-- top: huge half sun of halftone, zig-zag band -->
  <circle cx="200" cy="-20" r="230" fill="#ffd45c"/>
  <circle cx="200" cy="-20" r="230" fill="url(#w-dots)"/>
  <circle cx="200" cy="-20" r="120" fill="#b87400"/>
  <circle cx="200" cy="-20" r="70" fill="#6b4300"/>

  <!-- the ribbon: a format capsule with B, I, U, align bars, drawn as shapes -->
  <g transform="rotate(-8 200 250)">
    <rect x="24" y="210" width="362" height="84" rx="42" fill="#3d2600" transform="translate(10 10)"/>
    <rect x="24" y="210" width="362" height="84" rx="42" fill="#fff6dc"/>
    <!-- B -->
    <rect x="58" y="226" width="52" height="52" rx="16" fill="#6b4300"/>
    <path d="M74 236H88A10 10 0 0 1 88 250H74ZM74 252H90A11 11 0 0 1 90 268H74Z" fill="#fff6dc"/>
    <rect x="70" y="236" width="8" height="32" fill="#fff6dc"/>
    <!-- I -->
    <path d="M136 236H160L156 244H150L144 260H150L146 268H122L126 260H132L138 244H132Z" fill="#b87400"/>
    <!-- U -->
    <path d="M182 236H192V254A8 8 0 0 0 208 254V236H218V254A18 18 0 0 1 182 254Z" fill="#b87400"/>
    <rect x="180" y="270" width="40" height="5" fill="#b87400"/>
    <!-- align -->
    <g fill="#e09a00">
      <rect x="248" y="234" width="50" height="7" rx="3.5"/><rect x="256" y="248" width="34" height="7" rx="3.5"/>
      <rect x="248" y="262" width="50" height="7" rx="3.5"/>
    </g>
    <circle cx="340" cy="252" r="20" fill="#ffb800"/>
    <path d="M330 248L340 258L350 248" fill="none" stroke="#6b4300" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- back page, fanned -->
  <g transform="rotate(12 220 560)">
    <rect x="80" y="350" width="270" height="390" fill="#b87400"/>
    <rect x="80" y="350" width="270" height="390" fill="url(#w-hatch)"/>
  </g>

  <!-- the main page -->
  <g transform="rotate(-6 200 560)">
    <rect x="62" y="356" width="270" height="400" fill="#6b4300" transform="translate(14 14)"/>
    <path d="M62 356H284L332 404V756H62Z" fill="#fff6dc"/>
    <path d="M284 356V404H332Z" fill="#ffd45c"/>
    <!-- drop cap block -->
    <rect x="88" y="390" width="56" height="62" fill="#ffb800"/>
    <path d="M100 444L116 398L132 444H124L120 432H112L108 444ZM114 424H118L116 416Z" fill="#6b4300"/>
    <g fill="#ffb800">
      <rect x="156" y="392" width="128" height="12" rx="6"/>
      <rect x="156" y="414" width="110" height="12" rx="6"/>
      <rect x="156" y="436" width="140" height="12" rx="6"/>
      <rect x="88" y="466" width="208" height="12" rx="6"/>
      <rect x="88" y="488" width="180" height="12" rx="6"/>
    </g>
    <!-- highlighted line -->
    <rect x="82" y="508" width="226" height="28" fill="#ffd45c"/>
    <rect x="88" y="516" width="200" height="12" rx="6" fill="#b87400"/>
    <g fill="#ffb800">
      <rect x="88" y="548" width="196" height="12" rx="6"/>
      <rect x="88" y="570" width="150" height="12" rx="6"/>
      <rect x="88" y="606" width="208" height="12" rx="6"/>
      <rect x="88" y="628" width="120" height="12" rx="6"/>
    </g>
    <!-- bullet list -->
    <g fill="#e09a00">
      <circle cx="96" cy="668" r="6"/><rect x="110" y="662" width="130" height="12" rx="6"/>
      <circle cx="96" cy="692" r="6"/><rect x="110" y="686" width="96" height="12" rx="6"/>
    </g>
    <!-- the cursor -->
    <rect x="212" y="620" width="9" height="30" fill="#3d2600"/>
    <rect x="204" y="616" width="25" height="6" fill="#3d2600"/>
    <rect x="204" y="648" width="25" height="6" fill="#3d2600"/>
  </g>

  <!-- the giant pen nib bleeding off right, writing a looping line -->
  <path d="M40 856C90 800 140 900 190 846C230 802 260 860 296 818" fill="none" stroke="#3d2600" stroke-width="10" stroke-linecap="round"/>
  <g transform="rotate(38 330 790)">
    <path d="M330 640L392 760L352 870H308L268 760Z" fill="#3d2600"/>
    <path d="M330 640L392 760L352 870H330Z" fill="#6b4300"/>
    <rect x="300" y="866" width="60" height="30" fill="#b87400"/>
    <rect x="292" y="894" width="76" height="140" fill="#fff6dc"/>
    <rect x="292" y="930" width="76" height="16" fill="#e09a00"/>
    <circle cx="330" cy="760" r="14" fill="#ffb800"/>
    <rect x="327" y="640" width="6" height="110" fill="#ffb800"/>
  </g>

  <!-- confetti stars and dots -->
  <g fill="#fff6dc">
    <use xlink:href="#w-star" transform="translate(40 330) scale(1.1)"/>
    <use xlink:href="#w-star" transform="translate(366 340) scale(.7)"/>
    <use xlink:href="#w-star" transform="translate(30 780) scale(.8)"/>
    <use xlink:href="#w-star" transform="translate(360 120) scale(.9)"/>
    <use xlink:href="#w-star" transform="translate(40 120) scale(.6)"/>
  </g>
  <g fill="#6b4300"><circle cx="24" cy="560" r="7"/><circle cx="380" cy="600" r="6"/><circle cx="34" cy="660" r="4"/><circle cx="370" cy="460" r="5"/></g>

  <!-- ruler along the bottom -->
  <rect x="0" y="920" width="400" height="80" fill="#6b4300"/>
  <rect x="0" y="920" width="400" height="26" fill="#b87400"/>
  <g fill="#ffd45c">
    <rect x="10" y="920" width="5" height="22"/><rect x="30" y="920" width="5" height="12"/><rect x="50" y="920" width="5" height="12"/>
    <rect x="70" y="920" width="5" height="22"/><rect x="90" y="920" width="5" height="12"/><rect x="110" y="920" width="5" height="12"/>
    <rect x="130" y="920" width="5" height="22"/><rect x="150" y="920" width="5" height="12"/><rect x="170" y="920" width="5" height="12"/>
    <rect x="190" y="920" width="5" height="22"/><rect x="210" y="920" width="5" height="12"/><rect x="230" y="920" width="5" height="12"/>
    <rect x="250" y="920" width="5" height="22"/><rect x="270" y="920" width="5" height="12"/><rect x="290" y="920" width="5" height="12"/>
    <rect x="310" y="920" width="5" height="22"/><rect x="330" y="920" width="5" height="12"/><rect x="350" y="920" width="5" height="12"/>
    <rect x="370" y="920" width="5" height="22"/><rect x="390" y="920" width="5" height="12"/>
  </g>
  <rect x="0" y="956" width="400" height="44" fill="url(#w-dots-dark)"/>
</svg>
