<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000}#m{position:fixed;inset:0}#m canvas{width:100%;height:100%;display:block}</style>
<div id="m"></div>
<script type="module">
import { createLumenScene } from '../AI/js/lumen-scene.js';
const p = new URLSearchParams(location.search);
const tier = p.get('tier') || 'desktop';
const b = '../AI/assets/lumen/';
const a = n => ({ mobile: b + n + '-mobile.webp', desktop: b + n + '-desktop.webp' });
const m = document.getElementById('m');
const s = await (await import('../AI/js/lumen-scene.js')).createLumenSceneWithDependencies({ mount: m, quality: { textureTier: tier, pixelRatio: 1 }, assets: { earthDay: a('earth-day'), earthClouds: a('earth-clouds'), moonAlbedo: a('moon-albedo') }, preserveDrawingBuffer: true });
s.resize(innerWidth, innerHeight);
window.renderAt = ms => { s.render({ elapsedMs: ms }, 16); return true; };
window.ready = true;
</script>
