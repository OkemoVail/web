<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000}#m{position:fixed;inset:0}#m canvas{width:100%;height:100%;display:block}</style>
<div id="m"></div>
<script type="module">
const p = new URLSearchParams(location.search);
const tier = p.get('tier') || 'desktop';
const m = document.getElementById('m');
try {
  const mod = await import('../AI/js/lumen-scene.js?' + Date.now());
  const s = await mod.createLumenSceneWithDependencies({ mount: m, quality: { textureTier: tier, pixelRatio: 1, antialias: true }, preserveDrawingBuffer: true, interactive: false });
  s.resize(innerWidth, innerHeight);
  window.renderAt = ms => new Promise(r => { s.render({ elapsedMs: ms }, 16); requestAnimationFrame(() => requestAnimationFrame(() => r(true))); });
  window.ready = true;
} catch (e) { window.failed = String(e && e.stack || e); }
</script>
