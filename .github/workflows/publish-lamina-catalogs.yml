name: Publish Lamina catalogs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-lamina-catalogs
  cancel-in-progress: false

jobs:
  sign-bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: lamina-bootstrap-production
    steps:
      - name: Check out reviewed definitions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and verify Bootstrap catalog
        env:
          LAMINA_BOOTSTRAP_ED25519_PKCS8: ${{ secrets.LAMINA_BOOTSTRAP_ED25519_PKCS8 }}
        run: |
          mkdir -p generated/bootstrap
          node tools/lamina-repo/build-catalog.mjs \
            --input bootstrap/packages.json \
            --output generated/bootstrap/index.json \
            --private-key-env LAMINA_BOOTSTRAP_ED25519_PKCS8 \
            --public-key-output generated/bootstrap/public-key.txt \
            --fingerprint-output generated/bootstrap/public-key.sha256
          cmp generated/bootstrap/public-key.txt bootstrap/public-key.txt
          cmp generated/bootstrap/public-key.sha256 bootstrap/public-key.sha256
          node tools/lamina-repo/verify-catalog.mjs \
            --input generated/bootstrap/index.json \
            --public-key-file bootstrap/public-key.txt
      - name: Preserve signed Bootstrap catalog
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lamina-bootstrap-catalog
          path: generated/bootstrap/index.json
          if-no-files-found: error
          retention-days: 1

  sign-customizations:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: lamina-repo-production
    steps:
      - name: Check out reviewed definitions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and verify Customizations catalog
        env:
          LAMINA_REPO_ED25519_PKCS8: ${{ secrets.LAMINA_REPO_ED25519_PKCS8 }}
        run: |
          mkdir -p generated/repo
          node tools/lamina-repo/build-catalog.mjs \
            --input repo/packages.json \
            --output generated/repo/index.json \
            --private-key-env LAMINA_REPO_ED25519_PKCS8 \
            --public-key-output generated/repo/public-key.txt \
            --fingerprint-output generated/repo/public-key.sha256
          cmp generated/repo/public-key.txt repo/public-key.txt
          cmp generated/repo/public-key.sha256 repo/public-key.sha256
          node tools/lamina-repo/verify-catalog.mjs \
            --input generated/repo/index.json \
            --public-key-file repo/public-key.txt
      - name: Preserve signed Customizations catalog
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lamina-customizations-catalog
          path: generated/repo/index.json
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [sign-bootstrap, sign-customizations]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Restore signed Bootstrap catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lamina-bootstrap-catalog
          path: generated/bootstrap
      - name: Restore signed Customizations catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lamina-customizations-catalog
          path: generated/repo
      - name: Verify and stage both catalogs
        run: |
          node tools/lamina-repo/verify-catalog.mjs \
            --input generated/bootstrap/index.json \
            --public-key-file bootstrap/public-key.txt
          node tools/lamina-repo/verify-catalog.mjs \
            --input generated/repo/index.json \
            --public-key-file repo/public-key.txt
          cp generated/bootstrap/index.json bootstrap/index.json
          cp generated/repo/index.json repo/index.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          for (const path of ['bootstrap/repository.json', 'repo/repository.json']) {
            const descriptor = JSON.parse(readFileSync(path, 'utf8'));
            descriptor.status = 'ACTIVE';
            writeFileSync(path, `${JSON.stringify(descriptor, null, 2)}\n`, 'utf8');
          }
          NODE
          npm run test:lamina-catalogs
          npm run test:lamina-repositories
      - name: Commit reviewed catalog publication
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap/index.json bootstrap/repository.json repo/index.json repo/repository.json
          if git diff --cached --quiet; then
            echo "Catalogs are already current."
            exit 0
          fi
          git commit -m "chore: publish signed Lamina catalogs"
          git push origin "HEAD:${TARGET_BRANCH}"
