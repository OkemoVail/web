<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Okemo Word</title>
    <link rel="icon" type="image/x-icon" href="https://avatars.githubusercontent.com/u/179893130?v=4">

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" as="style" onload="this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
    <meta name="okemo-word-build" content="20261014-word-stretch-6">
    <script>
        (function () {
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            function applyTheme(isDark) {
                document.documentElement.classList.toggle('dark', isDark);
            }
            function resolveTheme() {
                const stored = localStorage.getItem('vail_theme');
                if (stored === 'dark') applyTheme(true);
                else if (stored === 'light') applyTheme(false);
                else applyTheme(mediaQuery.matches);
            }
            resolveTheme();
            mediaQuery.addEventListener('change', () => {
                const stored = localStorage.getItem('vail_theme');
                if (!stored || stored === 'system') applyTheme(mediaQuery.matches);
            });
            window.addEventListener('storage', (e) => {
                if (e.key === 'vail_theme') resolveTheme();
            });
        })();
    </script>

    <link rel="stylesheet" href="../src/site.css?v=20261014-word-stretch-6">
    <link rel="stylesheet" href="../liquid-design/liquid-design.css?v=20261007-api-audit">
    <script src="../src/glass-navigation.js"></script>
    <script defer src="../liquid-design/liquid-design.js?v=20261014-word-stretch-6"></script>
    <script defer src="../src/liquid-design-site.js?v=20261014-word-stretch-6"></script>
    
</head>

<body data-page="word">
    <div id="app">

        <!-- ── Header ──────────────────────────────────────────────── -->
        <header class="ow-header" aria-label="Document controls">
            <div class="wordmark" aria-label="Okemo Word">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                    <path d="M5.25 2.25h5.1l3.15 3.2v9.3c0 .55-.45 1-1 1h-7.25c-.55 0-1-.45-1-1V3.25c0-.55.45-1 1-1Z"
                        stroke="currentColor" stroke-width="1.45" stroke-linejoin="round" />
                    <path d="M10.25 2.5v3.25h3.05M6.75 9h4.25M6.75 11.75h4.25" stroke="currentColor"
                        stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <div class="ow-autosave" id="workspace-status" aria-live="polite">
                <span class="autosave-label">AutoSave</span>
                <span id="st-save">Not saved</span>
                <span id="hdr-word-count" class="visually-hidden">0 words</span>
            </div>
            <div class="document-identity">
                <input id="doc-title" type="text" value="Untitled Document" spellcheck="false" onblur="saveDoc(true)"
                    oninput="markUnsaved()" aria-label="Document title">
            </div>
            <div class="document-actions">
                <button class="hdr-btn skuo skuo-icon" onclick="newDoc()" title="New document" aria-label="New document"><i
                        class="fa-regular fa-file" aria-hidden="true"></i></button>
                <button class="hdr-btn skuo skuo-icon" id="save-btn" onclick="saveDoc()" title="Save document"
                    aria-label="Save document"><i class="fa-regular fa-floppy-disk" aria-hidden="true"></i></button>
                <button class="hdr-btn skuo skuo-icon" id="document-menu-btn" onclick="toggleDocumentMenu(event)"
                    title="Document actions" aria-label="Document actions" aria-haspopup="menu" aria-controls="document-menu"
                    aria-expanded="false"><span class="menu-dots" aria-hidden="true">•••</span></button>
                <button class="hdr-btn skuo skuo-icon" id="ai-toggle-btn" onclick="toggleAIPanel(event)"
                    title="Open Oaky writing assistant" aria-label="Open Oaky writing assistant" aria-controls="ai-panel"
                    aria-expanded="false"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i></button>
            </div>
        </header>

        <!-- ── Compact Home ribbon ────────────────────────────────── -->
        <div class="word-ribbon">
            <div class="ribbon-tab" aria-current="page">Home</div>
            <div class="ow-toolbar format-capsule" role="toolbar" aria-label="Home formatting tools">
                <select class="tb-select" id="fmt-select" title="Paragraph style" aria-label="Paragraph style"
                    onchange="formatBlock(this.value); this.blur();">
                    <option value="p">Normal</option>
                    <option value="h1">Heading 1</option>
                    <option value="h2">Heading 2</option>
                    <option value="h3">Heading 3</option>
                    <option value="blockquote">Quote</option>
                    <option value="pre">Code</option>
                </select>
                <div class="tb-sep"></div>
                <button class="tb-btn skuo skuo-icon" id="tb-bold" onclick="fmt('bold')" title="Bold  Ctrl+B" aria-label="Bold"
                    aria-pressed="false"><b aria-hidden="true">B</b></button>
                <button class="tb-btn skuo skuo-icon" id="tb-italic" onclick="fmt('italic')" title="Italic  Ctrl+I"
                    aria-label="Italic" aria-pressed="false"><em aria-hidden="true">I</em></button>
                <button class="tb-btn skuo skuo-icon" id="tb-underline" onclick="fmt('underline')" title="Underline  Ctrl+U"
                    aria-label="Underline" aria-pressed="false"><span aria-hidden="true">U</span></button>
                <div class="tb-sep"></div>
                <button class="tb-btn skuo skuo-icon" id="tb-al" onclick="fmt('justifyLeft')" title="Align left" aria-label="Align left" aria-pressed="false"><i class="fa-solid fa-align-left"></i></button>
                <button class="tb-btn skuo skuo-icon" id="tb-ac" onclick="fmt('justifyCenter')" title="Align center" aria-label="Align center" aria-pressed="false"><i class="fa-solid fa-align-center"></i></button>
                <button class="tb-btn skuo skuo-icon" id="tb-ar" onclick="fmt('justifyRight')" title="Align right" aria-label="Align right" aria-pressed="false"><i class="fa-solid fa-align-right"></i></button>
                <div class="tb-sep"></div>
                <button class="tb-btn skuo skuo-icon" id="tb-ul" onclick="fmt('insertUnorderedList')" title="Bullet list" aria-label="Bullet list" aria-pressed="false"><i class="fa-solid fa-list-ul"></i></button>
                <button class="tb-btn skuo skuo-icon" id="tb-ol" onclick="fmt('insertOrderedList')" title="Numbered list" aria-label="Numbered list" aria-pressed="false"><i class="fa-solid fa-list-ol"></i></button>
                <div class="tb-sep"></div>
                <button class="tb-btn skuo skuo-icon" onclick="insertLink()" title="Insert link" aria-label="Insert link"><i class="fa-solid fa-link"></i></button>
                <button class="tb-btn skuo skuo-icon" onclick="fmt('removeFormat')" title="Clear formatting" aria-label="Clear formatting"><i class="fa-solid fa-text-slash"></i></button>
            </div>
        </div>

        <!-- ── Export menu ─────────────────────────────────────────── -->
        <div id="document-menu" role="menu" aria-hidden="true">
            <button class="export-item skuo" role="menuitem" onclick="exportHTML()"><i class="fa-brands fa-html5"></i> Export as
                HTML</button>
            <button class="export-item mobile-menu-action skuo" role="menuitem" onclick="closeDocumentMenu(); newDoc()"><i
                    class="fa-regular fa-file"></i> New document</button>
            <button class="export-item skuo" role="menuitem" onclick="exportText()"><i class="fa-regular fa-file-lines"></i> Export as
                Text</button>
            <button class="export-item skuo" role="menuitem" onclick="copyAsHTML()"><i class="fa-regular fa-copy"></i> Copy HTML</button>
            <button class="export-item skuo" role="menuitem" onclick="copyAsText()"><i class="fa-solid fa-clipboard"></i> Copy Text</button>
            <div class="menu-separator" role="separator"></div>
            <button class="export-item skuo" role="menuitem" onclick="printDoc()"><i class="fa-solid fa-print"></i> Print</button>
        </div>

        <!-- ── Main ────────────────────────────────────────────────── -->
        <div class="ow-main">
            <!-- Document area -->
            <div class="doc-scroll" id="doc-scroll">
                <div class="document-stage">
                    <div class="editor-paper" id="editor-paper">
                        <div id="editor" contenteditable="true" spellcheck="true" data-placeholder="Start writing…"></div>
                    </div>
                </div>
            </div>

            <!-- AI Panel -->
            <aside id="ai-panel" class="collapsed" aria-label="Oaky writing assistant" aria-hidden="true" inert>

                <!-- Header -->
                <div class="ai-header">
                    <div class="ai-header-left">
                        <div class="ai-icon-ring"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                        <span class="ai-title">Oaky AI</span>
                    </div>
                    <div class="ai-header-right">
                        <button class="ai-clear-btn skuo skuo-accent" onclick="clearAIChat()" title="Clear conversation"
                            aria-label="Clear conversation">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>
                        <button class="ai-mobile-close skuo skuo-icon skuo-accent" onclick="toggleAIPanel(event)" title="Close AI panel"
                            aria-label="Close Oaky writing assistant">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>

                <!-- Messages -->
                <div id="ai-messages">
                    <div class="ai-welcome" id="ai-welcome">
                        <div class="ai-welcome-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                        <span class="ai-welcome-kicker">Writing partner</span>
                        <h4>Work on this draft</h4>
                        <p>Select a passage for precise edits, or ask Oaky to help shape the whole document.</p>
                    </div>
                </div>

                <!-- Quick actions -->
                <div class="ai-quick-actions" aria-label="Writing shortcuts">
                    <button class="skuo skuo-pill" onclick="quickPrompt('improve')"><i class="fa-solid fa-wand-magic-sparkles"></i> Improve</button>
                    <button class="skuo skuo-pill" onclick="quickPrompt('continue')"><i class="fa-solid fa-arrow-turn-down"></i> Continue</button>
                    <button class="skuo skuo-pill" onclick="quickPrompt('summarize')"><i class="fa-regular fa-file-lines"></i> Summarize</button>
                    <button class="skuo skuo-pill" onclick="quickPrompt('grammar')"><i class="fa-solid fa-text-slash"></i> Fix Grammar</button>
                    <button class="skuo skuo-pill" onclick="quickPrompt('shorter')">Shorter</button>
                    <button class="skuo skuo-pill" onclick="quickPrompt('expand')">Expand</button>
                    <button class="skuo skuo-pill" onclick="quickPrompt('suggest')"><i class="fa-regular fa-file-pen"></i> Suggest Edits</button>
                    <button class="skuo skuo-pill" onclick="quickPrompt('professional')">Professional</button>
                    <button class="skuo skuo-pill" onclick="quickPrompt('casual')">Casual</button>
                </div>

                <!-- Input -->
                <div class="ai-input-area">
                    <div class="ai-input-wrap">
                        <textarea id="ai-input" rows="1" onkeydown="handleAIKey(event)" aria-label="Ask Oaky"
                            oninput="autoResizeTA(this)"></textarea>
                        <button id="ai-send-btn" class="skuo-accent" onclick="handleSendAI()" aria-label="Send message">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>
                    <p class="ai-disclaimer">Oaky may make mistakes. Review before inserting.</p>
                </div>
            </aside>
        </div>

        <!-- ── Status bar ──────────────────────────────────────────── -->
        <div class="ow-status" aria-label="Document statistics">
            <span id="st-words">0 words</span>
            <span class="dot" aria-hidden="true">·</span>
            <span id="st-chars">0 characters</span>
            <span class="dot" aria-hidden="true">·</span>
            <span id="st-read">&lt; 1 min read</span>
        </div>

        <!-- Toast -->
        <div id="ow-toast"></div>

    </div><!-- #app -->

    <script src="./word.js?v=20261014-word-stretch-6"></script>
</body>

</html>
